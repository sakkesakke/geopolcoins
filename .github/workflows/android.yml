name: Human Override Android app

# Builds the Human Override Android app (c) 2026 Amghar Said and publishes the APK on the site.
# Signing: the owner's permanent upload key from GitHub secrets (HO_UPLOAD_KEYSTORE_B64, HO_UPLOAD_STORE_PASS,
# HO_UPLOAD_KEY_ALIAS, HO_UPLOAD_KEY_PASS) when they exist; otherwise a fresh random beta key per build.
# Also builds an .aab for Google Play (kept as a workflow artifact, not published on the site).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["human-override/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["human-override/android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Unit tests (DNS filter logic)
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          javac -d . "$GITHUB_WORKSPACE/human-override/android/app/src/main/java/xyz/geopolcoins/humanoverride/DnsLogic.java" "$GITHUB_WORKSPACE/human-override/android/test-jvm/DnsLogicTest.java"
          java -cp . DnsLogicTest
          javac -d . "$GITHUB_WORKSPACE/human-override/android/app/src/main/java/xyz/geopolcoins/humanoverride/SensorCheck.java" "$GITHUB_WORKSPACE/human-override/android/test-jvm/SensorCheckTest.java"
          java -cp . SensorCheckTest
          javac -d . "$GITHUB_WORKSPACE/human-override/android/app/src/main/java/xyz/geopolcoins/humanoverride/TamperLog.java" "$GITHUB_WORKSPACE/human-override/android/test-jvm/TamperTest.java"
          java -cp . TamperTest
      - name: Fresh block list into the app
        run: cp human-override/domains.txt human-override/android/app/src/main/assets/domains.txt
      - name: Build signed APK and AAB
        env:
          KS_B64: ${{ secrets.HO_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.HO_UPLOAD_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.HO_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.HO_UPLOAD_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Signing with the permanent upload key"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ho.jks"
            export HO_KS_PASS="$KS_PASS" HO_KEY_ALIAS="${KEY_ALIAS:-ho}" HO_KEY_PASS="${KEY_PASS:-$KS_PASS}"
          else
            echo "No upload key secret yet: signing with a fresh random beta key"
            PASS=$(openssl rand -hex 24); echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ho.jks" -alias ho -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Amghar Said, O=Human Override, C=BE" >/dev/null 2>&1
            export HO_KS_PASS="$PASS"
          fi
          HO_KEYSTORE="$RUNNER_TEMP/ho.jks" HO_VERSION_CODE="${{ github.run_number }}" \
            gradle -p human-override/android :app:assembleRelease :app:bundleRelease --no-daemon -q
          rm -f "$RUNNER_TEMP/ho.jks"
          ls -la human-override/android/app/build/outputs/apk/release/ human-override/android/app/build/outputs/bundle/release/
      - name: Verify the APK (official Android tools)
        run: |
          APK=human-override/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified|Signer #1 certificate DN|scheme"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable"
          unzip -l "$APK" | grep -E "assets/domains.txt|classes.dex"
      - name: Publish the APK on the site
        if: github.event_name != 'pull_request'
        run: |
          APK=human-override/android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" human-override/human-override-android.apk
          sha256sum human-override/human-override-android.apk | cut -d' ' -f1 > human-override/human-override-android.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-override/human-override-android.apk human-override/human-override-android.sha256
          git diff --cached --quiet && exit 0
          git commit -qm "Human Override Android app build ${{ github.run_number }}"
          # --autostash: the "fresh block list" step leaves assets/domains.txt changed, which made the pull fail silently
          ok=0; for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push -q && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || { echo "Could not publish the APK"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: human-override-android
          path: human-override/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Google Play bundle (.aab) for the Play Console
        uses: actions/upload-artifact@v7
        with:
          name: human-override-google-play-aab
          path: human-override/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: human-override-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Real test on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash human-override/android/e2e.sh apk/app-release.apk
