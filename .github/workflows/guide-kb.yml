name: Bolt guide knowledge

# Keeps guide-kb.json (what Bolt the guide knows) in step with the pages.
# On a pull request it only checks that it builds. On main it rebuilds and commits when it changed.
on:
  push:
    branches: [main]
    paths: ["*.html", "tools/guide_topics.json", "tools/build_guide_kb.py"]
  pull_request:
    paths: ["*.html", "tools/guide_topics.json", "tools/build_guide_kb.py", ".github/workflows/guide-kb.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guide-kb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build guide-kb.json
        run: python3 tools/build_guide_kb.py
      - name: Commit when changed (main only)
        if: github.event_name != 'pull_request'
        run: |
          git diff --quiet guide-kb.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-kb.json
          git commit -m "Bolt guide: rebuild knowledge"
          git push
