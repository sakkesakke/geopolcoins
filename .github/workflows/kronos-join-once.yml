name: Kronos Lab join (one-off)

# One-off helper: joins the per-coin results of run 41817160129 and saves them on this branch.
# Removed again in the next commit.
on:
  push:
    branches: [kronos-lab-fast]
    paths: [".github/workflows/kronos-join-once.yml"]

permissions:
  contents: write
  actions: read

jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          run-id: 41817160129
          github-token: ${{ github.token }}
      - name: Join and save on the branch
        run: |
          mkdir -p data
          python3 tools/kronos_lab.py --merge part-BTC.json part-ETH.json part-SOL.json --out data/kronos-lab.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kronos-lab.json
          git commit -m "Kronos Lab: first real data (joined)"
          git push
