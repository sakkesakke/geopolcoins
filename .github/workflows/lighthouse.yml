name: Lighthouse (speed, SEO, accessibility)

on:
  schedule:
    - cron: "0 6 * * 1"        # every Monday 06:00 UTC
  workflow_dispatch: {}          # run by hand from the Actions tab

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Lighthouse on the live site
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://geopolcoins.xyz/
            https://geopolcoins.xyz/factory.html
            https://geopolcoins.xyz/partners.html
            https://geopolcoins.xyz/garage.html
            https://geopolcoins.xyz/raid.html
          uploadArtifacts: true
          runs: 1
