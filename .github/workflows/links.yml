name: Broken links

on:
  schedule:
    - cron: "41 7 * * 3"        # every Wednesday 07:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every link in the pages
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 20
            --exclude 'supabase\.co' --exclude 'x\.com' --exclude 'twitter\.com'
            --exclude 'jup\.ag' --exclude 'dexscreener' --exclude 'esm\.sh'
            './*.html'
          fail: false
      - name: Open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: links
