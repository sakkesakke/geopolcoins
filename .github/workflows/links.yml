name: Broken links

on:
  schedule:
    - cron: "41 7 * * 3"        # every Wednesday 07:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every link in the pages
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 20
            --root-dir ${{ github.workspace }}
            --exclude 'supabase\.co' --exclude 'x\.com' --exclude 'twitter\.com'
            --exclude 'jup\.ag' --exclude 'dexscreener' --exclude 'esm\.sh'
            --exclude 'pump\.fun' --exclude 'platform\.openai\.com' --exclude 'console\.mistral\.ai'
            './*.html'
          fail: false
      - name: Open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: links
