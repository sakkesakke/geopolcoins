name: Offline Factory zip

# Keeps downloads/maiga-factory-offline.zip in step with the Factory and the Meme Studio.
# On a pull request it only checks that the zip can be built.
# On main it rebuilds the zip and commits it when the pages inside really changed.
on:
  push:
    branches: [main]
    paths: ["factory.html", "meme.html", "meme/**", "bolt.png", "logo.png", "tools/build_offline.py"]
  pull_request:
    paths: ["factory.html", "meme.html", "meme/**", "bolt.png", "logo.png", "tools/build_offline.py", ".github/workflows/offline-zip.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: offline-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep the old zip to compare
        run: cp downloads/maiga-factory-offline.zip /tmp/old.zip || true
      - name: Build the zip
        run: python3 tools/build_offline.py
      - name: Did the pages inside change?
        id: diff
        run: |
          mkdir -p /tmp/a /tmp/b
          unzip -q -o /tmp/old.zip -d /tmp/a || true
          unzip -q -o downloads/maiga-factory-offline.zip -d /tmp/b
          if diff -r /tmp/a /tmp/b >/dev/null; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit the new zip (main only)
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/maiga-factory-offline.zip
          git commit -m "Rebuild offline Factory zip"
          git push
      - name: Note for pull requests
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true'
        run: echo "::notice::The offline zip will be rebuilt automatically after this is merged."
