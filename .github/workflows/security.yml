name: Security (secrets + code scan)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 0"        # every Sunday 05:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secrets:
    name: No secrets in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (looks for keys, tokens, webhooks, seed phrases)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (JavaScript in the HTML pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
