name: Skill scan

# Scans every Claude skill and agent in .claude/ with NVIDIA SkillSpector (static, no AI, no keys).
# Fails when a skill gets a risk score above 50 (recommendation not SAFE/CAUTION).
on:
  pull_request:
    paths: [".claude/**", ".github/workflows/skill-scan.yml"]
  push:
    branches: [main]
    paths: [".claude/**"]
  schedule:
    - cron: "17 6 * * 1"        # every Monday 06:17 UTC (new vulnerability patterns)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SkillSpector (pinned commit)
        run: pip install "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@d7338f58200a9ae2a24810cee08911ab68b107a7"
      - name: Scan skills and agents
        run: |
          mkdir -p reports
          status=0
          echo "## SkillSpector report" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skill / agents | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for d in .claude/skills/*/ .claude/agents/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            set +e
            skillspector scan "$d" --no-llm --format json --output "reports/$n.json"
            code=$?
            set -e
            rec=$(python3 -c "import json,sys;r=json.load(open('reports/$n.json'));print(r.get('recommendation','?'),'· risk',r.get('risk_score','?'))" 2>/dev/null || echo "error")
            echo "| $n | $rec (exit $code) |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "0" ]; then status=1; fi
          done
          exit $status
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: reports/
          retention-days: 14
