# The Supabase publishable key is public by design (it is meant to be in the browser).
[extend]
useDefault = true

[allowlist]
description = "Public-by-design values"
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']
# Generated domain block lists (only public domain names, e.g. "api.example.com" trips generic-api-key)
paths = [
  '''^human-override/extension/rules_adult\.json$''',
  '''^human-override/adult/(adult|domains|hosts|adblock)\.txt$''',
  '''^human-override/android/app/src/main/assets/(adult|gamble|dating|bypass)\.txt$''',
  '''^human-override/(gamble|dating|bypass)/(gamble|domains|hosts|adblock|source|own)\.txt$''',
  '''^human-override/extension/rules_(gamble|dating|bypass)\.json$''',
]
