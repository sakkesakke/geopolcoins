<style>

.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

.col{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:240px;display:flex;flex-direction:column;gap:8px}

.card:hover{border-color:var(--cream)}
.card b{display:block;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.card .m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--dim);margin-top:4px}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:#0a1630;border:1px solid var(--line);color:var(--cream)}
.due{color:var(--red);font-weight:800}.soon{color:var(--warn);font-weight:700}
.s-new{border-left-color:var(--brass)}.s-contacted{border-left-color:var(--cyan)}.s-quote{border-left-color:#b48cff}.s-won{border-left-color:var(--ok)}.s-lost{border-left-color:#6b7894}.s-nurture{border-left-color:#4f9dff}
table{width:100%;border-collapse:collapse;background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{color:var(--dim);font-weight:600;font-size:13px;background:#0c1934}

.filters select{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:4px 10px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--cream);color:#1d1a14;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4)}

 en:{bot:['Your AI assistant for {c}','Hello {n},\n\nThank you for your request for {c}. To give you a clear price I need 3 things:\n1. Your price list and opening hours\n2. The 5 questions customers ask most\n3. Where the assistant should work (website, WhatsApp, phone)\n\nYou pay nothing until you agree with the quote.\n\nBest regards,\ngeopolcoins.xyz'],
     robotics:['AI for your robots: {c}','Hello {n},\n\nThank you for your interest. To prepare a proposal I would like to know:\n1. Which robots or fleet you use (brand, number)\n2. What should get easier (faults, orders, reports)\n3. Whether you can share manuals or logs\n\nWe always work on top of the robot’s own safety system, with human approval. A short 20-minute video call is often fastest. Which day suits you?\n\nBest regards,\ngeopolcoins.xyz'],
     kit:['Your Starter Kit','Hello {n},\n\nGreat that you downloaded the Starter Kit. Is the first bot working? If you like, I can look at your setup for 10 minutes, free.\n\nBest regards,\ngeopolcoins.xyz']},
 fr:{bot:['Votre assistant IA pour {c}','Bonjour {n},\n\nMerci pour votre demande pour {c}. Pour vous donner un prix clair, j’ai besoin de 3 choses :\n1. Vos tarifs et horaires\n2. Les 5 questions que vos clients posent le plus\n3. Où l’assistant doit travailler (site, WhatsApp, téléphone)\n\nVous ne payez rien avant d’accepter le devis.\n\nCordialement,\ngeopolcoins.xyz'],
     robotics:['IA pour vos robots : {c}','Bonjour {n},\n\nMerci pour votre intérêt. Pour préparer une proposition, j’aimerais savoir :\n1. Quels robots ou quelle flotte vous utilisez (marque, nombre)\n2. Ce qui doit devenir plus simple (pannes, ordres, rapports)\n3. Si vous pouvez partager des manuels ou des journaux\n\nNous travaillons toujours au-dessus du système de sécurité du robot, avec validation humaine. Un appel vidéo de 20 minutes est souvent le plus rapide. Quel jour vous convient ?\n\nCordialement,\ngeopolcoins.xyz'],
     kit:['Votre Starter Kit','Bonjour {n},\n\nMerci d’avoir téléchargé le Starter Kit. Le premier bot fonctionne ? Si vous voulez, je regarde votre configuration 10 minutes, gratuitement.\n\nCordialement,\ngeopolcoins.xyz']}};
function mailFor(r){var L=MAIL[r.lang]||MAIL.en,t=r.source==='starter_kit'?L.kit:r.segment==='robotics'?L.robotics:L.bot;var f=function(s){return s.replace(/\{n\}/g,r.name||'').replace(/\{c\}/g,r.company||r.name||'');};
 return 'mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent(f(t[0]))+'&body='+encodeURIComponent(f(t[1]));}
function openC(id){var r=rows.filter(function(x){return x.id===id;})[0];if(!r)return;cur=r;
 $('dTitle').textContent=title(r);
 $('dMeta').textContent='Bron: '+(SRC[r.source]||r.source)+' · aangemaakt '+new Date(r.created_at).toLocaleDateString('nl-BE')+' · laatst gewijzigd '+new Date(r.updated_at).toLocaleDateString('nl-BE');
 var f=$('dForm');['name','company','email','phone','stage','value_eur','kind','segment','lang','next_date','next_action'].forEach(function(k){f.elements[k].value=r[k]==null?'':r[k];});f.elements.tags.value=(r.tags||[]).join(', ');
 var fm=$('dFirst');fm.hidden=!r.first_message;fm.textContent=r.first_message||'';
 var q=$('dQuick');q.textContent='';
 if(r.email&&(r.tags||[]).indexOf('unsubscribed')<0)q.appendChild(el('a',{cls:'b sm main',href:mailFor(r),onclick:function(){addNote('email','Mail gestuurd (sjabloon).',true);if(r.stage==='new')setStage(r.id,'contacted');}},['✉ Mail sturen']));
 if(r.phone)q.appendChild(el('a',{cls:'b sm',href:'tel:'+r.phone.replace(/[^+\d]/g,'')},['☎ Bellen']));
 q.appendChild(el('button',{type:'button',cls:'b sm ok',onclick:function(){setStage(r.id,'won');}},['✓ Gewonnen']));
 q.appendChild(el('button',{type:'button',cls:'b sm',onclick:function(){setStage(r.id,'lost');}},['Verloren']));
 q.appendChild(el('button',{type:'button',cls:'b sm',onclick:function(){var d=new Date();d.setDate(d.getDate()+7);f.elements.next_date.value=d.toISOString().slice(0,10);f.requestSubmit();}},['+7 dagen']));
 $('shade').hidden=false;$('drawer').hidden=false;loadNotes(r.id);}
function closeC(){$('shade').hidden=true;$('drawer').hidden=true;cur=null;}
$('dClose').addEventListener('click',closeC);$('shade').addEventListener('click',closeC);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur)closeC();});
function loadNotes(id){var ul=$('dNotes');ul.textContent='';api('crm_notes?contact_id=eq.'+id+'&select=*&order=created_at.desc&limit=200').then(function(ns){ul.textContent='';
 var K={note:'Notitie',call:'Gebeld',email:'Mail',meeting:'Afspraak',task:'Taak',system:'Systeem'};
 (ns||[]).forEach(function(n){ul.appendChild(el('li',{cls:n.kind==='system'?'system':''},[el('small',{text:(K[n.kind]||n.kind)+' · '+new Date(n.created_at).toLocaleString('nl-BE')}),n.body]));});
 if(!ns||!ns.length)ul.appendChild(el('li',{cls:'system',text:'Nog niets.'}));}).catch(function(e){ul.textContent='Fout: '+e.message;});}
function addNote(kind,body,quiet){if(!cur)return Promise.resolve();var id=cur.id;return api('crm_notes',{method:'POST',body:{contact_id:id,kind:kind,body:body},prefer:'return=minimal'}).then(function(){
  return api('crm_contacts?id=eq.'+id,{method:'PATCH',body:{next_action:cur.next_action||''},prefer:'return=minimal'});}).then(function(){if(!quiet)toast('Toegevoegd');if(cur&&cur.id===id)loadNotes(id);}).catch(function(e){toast('Fout: '+e.message);});}
$('nAdd').addEventListener('click',function(){var b=$('nBody').value.trim();if(!b)return;addNote($('nKind').value,b).then(function(){$('nBody').value='';});});
$('dForm').addEventListener('submit',function(e){e.preventDefault();if(!cur)return;var f=e.target,id=cur.id;
 var body={name:f.elements.name.value.trim(),company:f.elements.company.value.trim(),email:f.elements.email.value.trim(),phone:f.elements.phone.value.trim(),stage:f.elements.stage.value,
  value_eur:Math.max(0,Math.min(9999999,parseFloat(f.elements.value_eur.value)||0)),kind:f.elements.kind.value,segment:(f.elements.segment.value.trim()||'other').toLowerCase().slice(0,30),lang:f.elements.lang.value,
  next_date:f.elements.next_date.value||null,next_action:f.elements.next_action.value.trim(),tags:f.elements.tags.value.split(',').map(function(s){return s.trim().toLowerCase();}).filter(Boolean).slice(0,12)};
 var stageChanged=body.stage!==cur.stage,old=cur.stage;
 api('crm_contacts?id=eq.'+id,{method:'PATCH',body:body,prefer:'return=representation'}).then(function(d){var n=d&&d[0];if(n){rows=rows.map(function(r){return r.id===id?n:r;});cur=n;}
   if(stageChanged)api('crm_notes',{method:'POST',body:{contact_id:id,kind:'system',body:'Fase: '+label(STAGES,old)+' → '+label(STAGES,body.stage)},prefer:'return=minimal'}).then(function(){loadNotes(id);});
   toast('Opgeslagen');render();openC(id);}).catch(function(e){toast('Niet opgeslagen: '+e.message);});});
$('dDel').addEventListener('click',function(){if(!cur||!confirm('Contact "'+title(cur)+'" en alle notities definitief verwijderen?'))return;var id=cur.id;
 api('crm_contacts?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'}).then(function(){rows=rows.filter(function(r){return r.id!==id;});closeC();render();toast('Verwijderd');}).catch(function(e){toast('Fout: '+e.message);});});
$('bNew').addEventListener('click',function(){var n=prompt('Naam of bedrijf van het nieuwe contact:');if(!n||!n.trim())return;
 api('crm_contacts',{method:'POST',body:{company:n.trim().slice(0,100),stage:'new',source:'manual',kind:'lead',lang:'nl',next_date:today(),next_action:'Eerste contact'},prefer:'return=representation'}).then(function(d){
  if(d&&d[0]){rows.unshift(d[0]);render();openC(d[0].id);}}).catch(function(e){toast('Fout: '+e.message);});});
$('bCsv').addEventListener('click',function(){var cell=function(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
 var cols=['id','company','name','email','phone','kind','segment','stage','value_eur','next_date','next_action','tags','source','lang','created_at','updated_at'];
 var lines=[cols.join(',')].concat(rows.map(function(r){return cols.map(function(c){return cell(c==='tags'?(r.tags||[]).join(' '):r[c]);}).join(',');}));
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='maiga-crm-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);});
$('bOut').addEventListener('click',function(){fetch(URL0+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.token}}).catch(function(){});sessionStorage.removeItem(SK);location.href='admin.html';});
/* idle logout after 30 min, like the admin page */
var idle;function bump(){clearTimeout(idle);idle=setTimeout(function(){sessionStorage.removeItem(SK);location.href='admin.html';},30*60000);}['click','keydown'].forEach(function(e){document.addEventListener(e,bump);});bump();
setTimeout(function(){if(session.exp<Date.now()+60000){sessionStorage.removeItem(SK);location.href='admin.html?next=crm';}},Math.max(5000,session.exp-Date.now()-60000));
load();
})();
</script>
