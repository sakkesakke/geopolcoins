<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mindveto</title><link rel="stylesheet" href="style.css"></head>
<body><div class="pop">
<div class="head"><img src="icons/48.png" alt=""><b>MINDVETO</b></div>
<button id="big" class="big on" type="button"></button>
<p id="status" class="status"></p>
<div class="card"><h3 id="hCats"></h3><div id="cats"></div></div>
<div class="card"><h3 id="hSched"></h3><label class="cat"><input type="checkbox" id="scOn"><span id="scLbl"></span></label><div id="scDays" class="days"></div><div class="row"><input id="scFrom" type="time" aria-label="from"><input id="scTo" type="time" aria-label="to"><button id="scSave" type="button"></button></div><div class="row"><select id="scHol" aria-label="School holidays"></select><select id="scReg" aria-label="Region"></select></div><p id="scNote" class="foot" style="text-align:left;margin:6px 0 0"></p></div>
<div class="card"><h3 id="hGuard"></h3><label class="cat"><input type="checkbox" id="gOn"><span id="gLbl"></span></label><p id="gNote" class="foot" style="text-align:left;margin:6px 0 0"></p><h4 id="hWords"></h4><div class="row"><input id="addW" maxlength="60" autocomplete="off"><button id="addWb" type="button" aria-label="add">+</button></div><div id="tagsW" class="tags"></div><p id="wNote" class="foot" style="text-align:left;margin:6px 0 0"></p></div>
<div class="card"><h3 id="hBlock"></h3><div class="row"><input id="addB" placeholder="example-ai.com" autocomplete="off"><button id="addBb" type="button">+</button></div><div id="tagsB" class="tags"></div></div>
<div class="card"><h3 id="hAllow"></h3><p id="svNote" class="foot" style="text-align:left;margin:0 0 6px"></p><div id="svc"></div><h4 id="hAllowMore"></h4><div class="row"><input id="addA" placeholder="example.com" autocomplete="off"><button id="addAb" type="button">+</button></div><div id="tagsA" class="tags"></div><p id="aNote" class="foot" style="text-align:left;margin:6px 0 0"></p></div>
<div class="card"><h3 id="hClass"></h3><p id="clState" class="status" style="text-align:left;margin:0 0 6px"></p><div class="row" id="clJoin"><input id="clCode" maxlength="9" placeholder="ABCD-2345" autocomplete="off" autocapitalize="characters"><button id="clJoinB" type="button"></button></div><button id="clLeave" type="button" class="link" hidden></button><p id="clNote" class="foot" style="text-align:left;margin:6px 0 0"></p></div>
<div class="card"><h3 id="hPin"></h3><div class="row"><input id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off"><button id="pinB" type="button"></button></div><p id="pinNote" class="foot" style="text-align:left;margin:6px 0 0"></p></div>
<div class="card"><h3 id="hLog"></h3><ul id="log" class="log"></ul><button id="seen" type="button" hidden></button></div>
<p id="msg" class="msg"></p>
<a id="don" class="don" href="https://ko-fi.com/geopolcoins" target="_blank" rel="noopener"></a>

</div><script src="popup.js"></script></body></html>
