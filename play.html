<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:#02020a;font-family:Impact,sans-serif;color:#fff}
#wrap{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
.start-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#07152d;border:3px solid #000;border-radius:12px;padding:14px 32px;font-family:Impact,sans-serif;font-size:20px;cursor:pointer;box-shadow:0 5px 0 #9caec8;z-index:10}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;color:#ffd800;font-size:14px;letter-spacing:2px;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:5}
#over{position:absolute;inset:0;background:rgba(2,2,10,.92);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:20}
#over h3{color:#fff;font-size:30px;margin-bottom:10px;text-shadow:2px 2px 0 #e63946}
#over p{color:#fff;font-size:14px;margin-bottom:8px}
#over strong{color:#ffd800;font-size:22px}
#over button{background:#fff;color:#07152d;border:3px solid #000;border-radius:10px;padding:10px 24px;font-family:Impact;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #9caec8;margin-top:12px}
</style>
<meta name="description" content="Play the $MAIGA arcade right in your browser. Free, no wallet needed. Entertainment only.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#050b1b">
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="480"></canvas>
<div id="hud"><span>SCORE: <span id="s">0</span></span><span>MAIGA FLAPPY</span></div>
<button class="start-btn" id="startBtn">START</button>
<div id="over"><h3>GAME OVER</h3><p>Score: <strong id="fs">0</strong></p><button id="againBtn">PLAY AGAIN</button></div>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=480,H=480,run=false,raf=null,score=0,last=0;
var bird,pipes,gTimer;
var G=1400,FLAP=-380,PIPE_SPD=170,PIPE_GAP=160,PIPE_W=60;

function setScore(s){score=s;document.getElementById('s').textContent=s}

document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);
canvas.addEventListener('pointerdown',function(e){e.preventDefault();flap()});
canvas.addEventListener('touchstart',function(e){e.preventDefault();flap()},{passive:false});
window.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();flap()}});

function flap(){if(run)bird.vy=FLAP}

function start(){
  document.getElementById('startBtn').style.display='none';
  document.getElementById('over').style.display='none';
  score=0;setScore(0);
  bird={x:W*0.3,y:H*0.45,vy:0,r:16,rot:0};
  pipes=[];gTimer=0;
  run=true;
  last=performance.now();
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function loop(now){
  if(!run)return;
  var dt=Math.min((now-last)/1000,0.033);last=now;

  bird.vy+=G*dt;
  bird.y+=bird.vy*dt;
  bird.rot=Math.max(-0.5,Math.min(1.2,bird.vy/700));

  gTimer-=dt;
  if(gTimer<=0){
    var gy=80+Math.random()*(H-80-PIPE_GAP-80);
    pipes.push({x:W+20,gapY:gy,scored:false});
    gTimer=1.6;
  }
  pipes.forEach(function(p){
    p.x-=PIPE_SPD*dt;
    if(!p.scored&&p.x+PIPE_W<bird.x){p.scored=true;setScore(score+1)}
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
      if(bird.y-bird.r<p.gapY||bird.y+bird.r>p.gapY+PIPE_GAP)gameOver();
    }
  });
  pipes=pipes.filter(function(p){return p.x>-PIPE_W-20});
  if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0}
  if(bird.y+bird.r>H-40)gameOver();

  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0a3a');g.addColorStop(1,'#0a0520');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.3)';
  for(var i=0;i<30;i++)ctx.fillRect((i*137)%W,(i*89)%(H-60),2,2);

  pipes.forEach(function(p){
    ctx.fillStyle='#7db8ff';
    ctx.fillRect(p.x,0,PIPE_W,p.gapY);
    ctx.fillRect(p.x,p.gapY+PIPE_GAP,PIPE_W,H-(p.gapY+PIPE_GAP));
    ctx.fillStyle='#4a7fc0';
    ctx.fillRect(p.x,0,5,p.gapY);
    ctx.fillRect(p.x,p.gapY+PIPE_GAP,5,H-(p.gapY+PIPE_GAP));
    ctx.fillStyle='#a9d4ff';
    ctx.fillRect(p.x-4,p.gapY-16,PIPE_W+8,16);
    ctx.fillRect(p.x-4,p.gapY+PIPE_GAP,PIPE_W+8,16);
    ctx.save();ctx.translate(p.x+PIPE_W/2,p.gapY-40);
    ctx.shadowColor='#ffd800';ctx.shadowBlur=12;
    ctx.fillStyle='#ffd800';
    ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font='bold 14px Impact';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);
    ctx.restore();
  });

  ctx.fillStyle='#0a0a1f';ctx.fillRect(0,H-40,W,40);
  ctx.strokeStyle='#ffd800';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,H-40);ctx.lineTo(W,H-40);ctx.stroke();

  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  ctx.shadowColor='#ffd800';ctx.shadowBlur=15;
  ctx.fillStyle='#ffd800';
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-14);ctx.lineTo(-6,0);ctx.lineTo(-10,14);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='#f5d6b3';ctx.beginPath();ctx.arc(2,-2,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f2cf5b';ctx.beginPath();ctx.arc(2,-4,7,Math.PI,0);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,-2,1.2,0,Math.PI*2);ctx.arc(4,-2,1.2,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(run)raf=requestAnimationFrame(loop);
}

function gameOver(){
  run=false;
  document.getElementById('fs').textContent=score;
  document.getElementById('over').style.display='flex';
}

setTimeout(start,400);
})();
</script>
</body>
</html>
