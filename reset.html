<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Set a new admin password</title>
<style>
:root{--bg:#050b1b;--panel:#0b1a35;--text:#f4f7ff;--dim:#a7b7d2;--gold:#ffd700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:460px;margin:8vh auto;padding:0 16px}
.card{background:var(--panel);border:1px solid rgba(169,212,255,.25);border-radius:12px;padding:20px}
h1{font-size:22px;margin:0 0 8px;color:var(--gold)}label{display:block;margin:14px 0 4px;color:var(--dim);font-size:14px}
input{width:100%;padding:11px;border-radius:8px;border:2px solid #000;background:#050b14;color:#fff;font-size:16px}
button{margin-top:18px;width:100%;padding:12px;border-radius:8px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#msg{margin-top:14px;font-size:14px;min-height:1.4em}.err{color:#ff7a7a}.ok{color:#7be29b}
.note{font-size:12px;color:var(--dim);margin-top:12px}
</style></head><body><main><div class="card">
<h1>Set a new password</h1>
<div class="note" style="margin:0 0 6px">For the $MAIGA admin account. Use the link from the reset email, within 1 hour.</div>
<form id="f" autocomplete="off">
<label for="p1">New password (at least 12 characters)</label>
<input id="p1" type="password" autocomplete="new-password" minlength="12" required>
<label for="p2">Repeat password</label>
<input id="p2" type="password" autocomplete="new-password" minlength="12" required>
<button id="b" type="submit">SAVE PASSWORD</button>
</form>
<div id="msg" role="status"></div>
<div class="note">This page only talks to our Supabase project. Never share your password or this link with anyone.</div>
</div></main>
<script>
(function(){
  var SUPABASE_URL='https://zslzbfbqrtfpvgbjhssd.supabase.co';
  var KEY='sb_publishable_90hLwzv3xb0aZmPtaHKZag_1hKkG0EN';
  var h=new URLSearchParams(location.hash.replace(/^#/,''));
  var token=h.get('access_token'), type=h.get('type');
  try{history.replaceState(null,'',location.pathname);}catch(e){}   // remove the token from the address bar
  var msg=document.getElementById('msg'), f=document.getElementById('f'), b=document.getElementById('b');
  function say(t,c){msg.textContent=t;msg.className=c||'';}
  if(!token||type!=='recovery'){f.style.display='none';say('This link is missing or has expired. Request a new password reset email in Supabase (Authentication, Users).','err');return;}
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    var a=document.getElementById('p1').value,c=document.getElementById('p2').value;
    if(a.length<12){say('Use at least 12 characters.','err');return;}
    if(a!==c){say('The two passwords are not the same.','err');return;}
    b.disabled=true;say('Saving...');
    try{
      var r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});
      var j={};try{j=await r.json();}catch(x){}
      if(r.ok){f.style.display='none';say('Password saved. You can now sign in at geopolcoins.xyz/admin.html.','ok');}
      else{b.disabled=false;say((j.msg||j.error_description||j.message||'Could not save (HTTP '+r.status+').'),'err');}
    }catch(x){b.disabled=false;say('Network error. Try again.','err');}
  });
})();
</script></body></html>
